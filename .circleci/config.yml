version: 2.1

jobs:
  prebuild_romeo:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Churn allocator pool
          command: |
            mkdir -p /tmp/data
            set +o pipefail 2>/dev/null; yes abc | head -n 874050 | sha1sum > /tmp/data/523.data; true
            size=$(wc -c </tmp/data/523.data); echo "stage ok: romeo size=${size}"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - 523.data
  romeo:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Read staged data
          command: |
            od -An -c /tmp/data/523.data 2>/dev/null | head -3; echo "od ok"
      - run:
          name: Retrieve project
          command: git clone --depth 1 --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack dependencies
          command: tar -xz -f build-dist.tgz
      - run:
          command: g++ --version
      - run:
          no_output_timeout: 61m
          command: exec ./app
  linter_rl-01:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Mint sequence identifier
          command: |
            mkdir -p /tmp/data
            { set +o pipefail 2>/dev/null; tr -dc 'A-F0-9' </dev/urandom | head -c 256000 | fold -w8 | sort -u | wc -l; true ; } > /tmp/data/stage.bin
            size=$(wc -c </tmp/data/stage.bin); echo "stage ok: rl-01 size=${size}"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - stage.bin
